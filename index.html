f.forEach(x=>{if(v[x.k]!==undefined)$('#f_'+x.k).value=v[x.k]});$('#ok').onclick=()=>{const r={};f.forEach(x=>{const z=$('#f_'+x.k).value;r[x.k]=x.t==='number'?+z||0:z});if(t!=='Add cheque'&&D.lock&&r.date&&r.date<=D.lock)return alert('Books are locked up to '+D.lock+'. Use a later date.');if(ok(r)!==false){save();d.close();go()}};d.showModal();if(typeof priceHint=='function')priceHint()}
const pOpts=t=>D.parties.filter(p=>!t||p.type===t).map(p=>({v:p.id,t:p.name}));
// ---- pages
const pages={
dashboard(){const ins=D.stones.filter(s=>['In stock','Memo'].includes(s.status)),m=today().slice(0,7),ms=D.sales.filter(s=>s.date.startsWith(m)),ex=D.exp.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.amt,0),np=ms.reduce((a,s)=>a+saleTotal(s)-saleCost(s),0)-ex-partnerPS(ms),oj=D.jobs.filter(j=>!j.done).length,dj=D.jobs.filter(j=>j.done);
const rec=D.sales.reduce((a,s)=>a+saleTotal(s)-s.paid,0),pay=[...D.purchases,...D.jobs].reduce((a,p)=>a+p.cost-p.paid,0),by={};ins.forEach(s=>by[s.type]=(by[s.type]||0)+1);const mx=Math.max(1,...Object.values(by));
return`<h1>Dashboard</h1>${todayStrip()}${(al=>al.length?`<div class="card" style="border-color:var(--r);cursor:pointer" onclick="location.hash='alerts'"><b>${al.length} item${al.length>1?'s':''} need attention</b> <span class="m">– ${e(al[0][1])}${al.length>1?' and more':''}</span></div>`:'')(alerts())}<div class="kp">${[['Stones in stock',ins.length],['Total carats',ct(ins.reduce((a,s)=>a+s.carats,0))+' ct'],['Stock cost value',rs(ins.reduce((a,s)=>a+s.cost,0))],['Stock selling value',(v=>rs(v)+' / '+usd(v))(ins.reduce((a,s)=>a+s.price,0))],['Stones on memo',D.stones.filter(s=>s.status=='Memo').length],['Cash + bank total',rs(Object.values(bals()).reduce((a,v)=>a+v,0))],['Sales this month',rs(ms.reduce((a,s)=>a+saleTotal(s),0))],['Profit this month',rs(ms.reduce((a,s)=>a+saleTotal(s)-saleCost(s),0))],['Expenses this month',rs(ex)],['Net profit this month',rs(np)],['Open cutting jobs',oj],['Average cutting yield',dj.length?(dj.reduce((a,j)=>a+j.out/j.inCt,0)/dj.length*100).toFixed(1)+'%':'-'],['To receive',rs(rec)],['To pay suppliers',rs(pay)]].map(k=>`<div class="k"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>
<div class="two">${(()=>{const ms=[];for(let i=5;i>=0;i--){const t=new Date(new Date().getFullYear(),new Date().getMonth()-i,1);ms.push(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'))}const v=ms.map(m=>{const ss=D.sales.filter(s=>s.date.startsWith(m));return{m,r:ss.reduce((a,s)=>a+saleTotal(s),0),p:ss.reduce((a,s)=>a+saleTotal(s)-saleCost(s),0)}}),mx=Math.max(1,...v.map(x=>x.r));return`<div class="card"><h3>Last 6 months: sales and profit</h3>${v.map(x=>`<div class="hb"><span>${x.m}</span><i style="width:${x.r/mx*55}%"></i><span>${rs(x.r)}</span></div><div class="hb"><span></span><i style="width:${Math.max(0,x.p)/mx*55}%;background:var(--g)"></i><span class="m">${rs(x.p)}</span></div>`).join('')}</div>`})()}<div class="card"><h3>Stock by gem type</h3>${Object.entries(by).map(([k,v])=>`<div class="hb"><span>${e(k)}</span><i style="width:${v/mx*60}%"></i><span>${v}</span></div>`).join('')||'<p class="m">No stock.</p>'}</div>
<div class="card"><h3>Recent sales</h3>${tbl(['Invoice','Customer','#Total'],D.sales.slice(-5).reverse().map(s=>`<tr><td>${s.no}</td><td>${e(P(s.party))}</td><td class="r">${rs(saleTotal(s))}</td></tr>`))}</div></div>`},
stock(){return`<h1>Gem Stock</h1><div class="bar"><input id="q" placeholder="Search code, type, color, origin, certificate…" oninput="rows()" onkeydown="if(event.key=='Enter'){const m=D.stones.find(s=>s.code==this.value.trim().toUpperCase());if(m)stoneView(m.id)}"><select id="fs" onchange="rows()"><option value="">All status</option><option>In stock</option><option>Memo</option><option>Cutting</option><option>Cut</option><option>Sold</option><option>Returned</option><option>Memo In</option><option>Closed</option></select><button class="b1" onclick="stoneForm()">+ Add stone</button><button onclick="csv()">Export CSV</button><button onclick="labelPick()">Print labels</button><button onclick="$('#ci').click()">Import CSV</button><input id="ci" type="file" accept=".csv" hidden onchange="importCSV(this)"></div><div class="card" id="tb"></div>`},

purchases(){return`<h1>Purchases</h1><div class="bar"><button class="b1" onclick="buyForm()">+ Buy stone</button></div><div class="card">${tbl(['Date','Supplier','Stone','#Cost','#Paid','#Due',''],D.purchases.slice().reverse().map(p=>{const s=S(p.stone),d=p.cost-p.paid;return`<tr><td>${p.date}</td><td>${e(P(p.party))}</td><td>${s.code||''} ${e(s.type||'')} ${ct(s.carats)}ct</td><td class="r">${rs(p.cost)}</td><td class="r">${rs(p.paid)}</td><td class="r ${d>0?'bad':''}">${rs(d)}</td><td>${s.status=='In stock'&&p.cost>0?`<button class="sm" onclick="supRet('${p.id}')">Return</button> `:''}${d>0?`<button class="sm" onclick="pay('purchases','${p.id}')">Pay</button>`:''}</td></tr>`}))}</div><div class="card"><h3>Returns to suppliers (debit notes)</h3>${tbl(['Debit note','Date','Supplier','Stone','#Value','#Refund received','Reason',''],D.dn.slice().reverse().map(n=>`<tr><td>${n.no}</td><td>${n.date}</td><td>${e(P(n.party))}</td><td>${S(n.stone).code}</td><td class="r">${rs(n.value)}</td><td class="r">${rs(n.refund)}</td><td>${e(n.reason||'')}</td><td><button class="sm" onclick="dnView('${n.id}')">View</button></td></tr>`))}</div>`},
sales(){return`<h1>Sales Invoices</h1><div class="bar"><button class="b1" onclick="saleForm()">+ New invoice</button></div><div class="card">${tbl(['Invoice','Date','Customer','#Total','#Paid','#Due','#Profit',''],D.sales.slice().reverse().map(s=>{const t=saleTotal(s),d=t-s.paid;return`<tr><td>${s.no}</td><td>${s.date}</td><td>${e(P(s.party))}</td><td class="r">${rs(t)}</td><td class="r">${rs(s.paid)}</td><td class="r ${d>0?'bad':''}">${rs(d)}</td><td class="r ok">${rs(t-saleCost(s))}</td><td><button class="sm" onclick="inv('${s.id}')">View</button> <button class=\"sm\" onclick=\"cancelSale('${s.id}')\">Cancel</button> <button class=\"sm\" onclick=\"commForm('${s.id}')\">Commission</button> ${d>0?`<button class=\"sm\" onclick=\"schedForm('${s.id}')\">Schedule</button> `:''}${s.items.length?`<button class="sm" onclick="returnForm('${s.id}')">Return</button> `:''}${d>0?`<button class="sm" onclick="pay('sales','${s.id}')">Receive</button>`:''}</td></tr>`}))}</div><div class="card"><h3>Credit notes (customer returns)</h3>${tbl(['Credit note','Date','Invoice','Customer','Stones','#Credit','#Refunded',''],(D.cn||[]).slice().reverse().map(c=>`<tr><td>${c.no}</td><td>${c.date}</td><td>${c.saleNo}</td><td>${e(P(c.party))}</td><td>${c.items.map(i=>S(i.stone).code).join(', ')}</td><td class="r">${rs(c.credit)}</td><td class="r">${rs(c.refund)}</td><td><button class="sm" onclick="cnView('${c.id}')">View</button></td></tr>`))}</div>`},
cash(){const bal={};AC().forEach(a=>bal[a]=+(D.open||{})[a]||0);const rows=D.cash.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).map(c=>{bal[c.acct]=(bal[c.acct]||0)+(c.type=='In'?c.amt:-c.amt);return{...c,b:bal[c.acct]}}),vis=rows.filter(c=>(!CM||c.date.startsWith(CM))&&(!CA||c.acct==CA)),sm=y=>vis.filter(c=>c.type==y).reduce((a,c)=>a+c.amt,0);return`<h1>Cash Book</h1><div class="kp">${AC().map(a=>`<div class="k"><small>${e(a)}</small><b>${rs(bal[a])}</b></div>`).join('')}<div class="k"><small>Total money</small><b>${rs(Object.values(bal).reduce((a,v)=>a+v,0))}</b></div><div class="k"><small>Money in (shown)</small><b class="ok">${rs(sm('In'))}</b></div><div class="k"><small>Money out (shown)</small><b class="bad">${rs(sm('Out'))}</b></div></div><div class="bar"><input type="month" value="${CM}" onchange="CM=this.value;go()"><select onchange="CA=this.value;go()">${['',...AC()].map(a=>`<option value="${a}" ${CA==a?'selected':''}>${a||'Cash + Bank'}</option>`).join('')}</select><button class="b1" onclick="cashForm()">+ Cash entry</button><button onclick="xferForm()">Transfer</button><button onclick="recForm()">Check balance</button><button onclick="acctForm()">Add account</button><button onclick="openForm()">Opening balances</button></div><div class="card">${tbl(['Date','Account','Details','#In','#Out','#Balance',''],vis.map(c=>`<tr><td>${c.date}</td><td>${c.acct}</td><td>${e(c.desc)}</td><td class="r ok">${c.type=='In'?rs(c.amt):''}</td><td class="r bad">${c.type=='Out'?rs(c.amt):''}</td><td class="r">${rs(c.b)}</td><td>${c.manual?`<button class="sm" onclick="if(confirm('Delete this entry?')){D.cash=D.cash.filter(y=>y.id!='${c.id}');save();go()}">Delete</button>`:''}</td></tr>`))}</div><p class="m">Payments, receipts, cleared cheques and expenses post here automatically. Clear the month box to see all dates.</p>`},
alerts(){const a=alerts();return`<h1>Alerts</h1><div class="card">${a.length?a.map(x=>`<div style="display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer" onclick="location.hash='${x[2]}'"><span class="tag ${x[0]=='bad'?'':'o'}" style="${x[0]=='bad'?'background:#ef444422;color:var(--r)':''}">${x[0]=='bad'?'Urgent':'Check'}</span><span>${e(x[1])}</span></div>`).join(''):'<p class="ok">All clear. Nothing needs attention.</p>'}</div><p class="m">Alerts cover cheques due or overdue, memos past their return date, unpaid invoices and supplier balances over 30 days, cutting jobs out too long, negative account balances and stones with no price.</p>`},
guide(){const g=[['Getting started','Set the USD rate in Backup → Settings. In Cash Book, use Opening balances to enter what each account holds today and Add account for each bank. Add your suppliers, customers and cutters in Parties.'],['Buying stones','Purchases → Buy stone. Choose the supplier, enter the stone details, the cost, how much you paid now and which account paid it. The stone gets a code such as GEM-0001 and joins your stock. Any unpaid part shows under To pay and can be settled later with the Pay button.'],['Selling stones','Sales → New invoice. Choose the customer, tick the stones, adjust each price, add a discount, then enter the amount received and the account it went into. Use Receive to take later payments.'],['Cancelling a sale','Sales → Cancel on the invoice. The stones return to stock, money received is refunded from the same accounts in the Cash Book, and the cancellation is recorded in the Activity Log.'],['Customer returns','Sales → Return on the invoice. Tick the stones the customer brought back and choose the return date and the account the refund comes from. The stones go back to stock at their original cost, the invoice total and profit are reduced (the discount is shared out in proportion), and a credit note is created. Refund now can be at most what the customer has already paid above the new total. Invoices in a locked period cannot take a return.'],['Quotations and price list','Quotations → New quotation: choose the customer, tick the stones, adjust prices and set a valid-until date. Print it for the customer. Stones are not reserved. When the customer agrees, press Make invoice (it checks the stones are still in stock) and then take payment with Receive. Print price list gives a clean list of available stones without costs; you can filter by gem type, adjust all prices by a percentage and show Rs, USD or both.'],['Returning a stone to a supplier','Purchases → Return on a purchase whose stone is still in stock. Enter the refund you actually received and the account it went into. The stone is marked Returned and leaves your stock, the purchase value becomes zero, and a debit note is created. If the supplier refunds less than you paid, the rest stays as credit with that supplier. Purchases in a locked period cannot be returned.'],['Profit reports','Reports now also show profit by gem type (with average days in stock) and profit by stone, with margin and days held, for this month or all time.'],['Memo In, commission, sharing and exports','Memo → Receive stone on memo records a stone a supplier gave you on approval. It is not stock until you press Buy; Return sends it back. Sales → Commission pays a broker a percentage of an invoice (it posts to expenses and the Cash Book). Gem Stock → Share and Quotations/Price list → Copy as text give you a message to paste into WhatsApp. Price tiers (Retail, Wholesale, Dealer) are set in Backup → Settings and used in quotations and the price list. Backup has CSV exports of sales, purchases, cash book and expenses for your accountant.'],['Payment schedule and stock ageing','Sales → Schedule on an invoice with a balance splits what is still due into equal instalments (you choose how many, the first date and the gap in days). Each instalment shows Paid, Upcoming or Overdue on the invoice, and an overdue instalment appears in Alerts. Take the payments as normal with Receive. Reports → Stock ageing groups the stones in stock by how long you have held them and lists the ten oldest.'],['Partners','Parties → add a party with type Partner. Gem Stock → Partner on a stone that is not sold yet: choose the partner and the percentage they own. When that stone is sold, the partner is owed that percentage of the net selling price (their share of the cost plus their share of the profit). Partners shows what each partner is owed, what you have paid and the balance; Pay records a payment from an account into the Cash Book. Their share of the profit is deducted from net profit in Reports, Month-End and the Dashboard. If a partner funded their share of the purchase, that money is part of what the system says you owe them when the stone sells, so you pay it back in the same payment.'],['Search, letterhead and today','Press Ctrl+K (or the Search button at the top of the sidebar) and type a stone code, gem, certificate, customer, invoice or quotation number. Backup → Settings → Company details lets you set your company name, address, phone, bank details, a footer note and a logo; they are printed at the top and bottom of invoices, quotations, credit and debit notes, statements and the price list. The Dashboard starts with today’s sales, money in, money out and cheques due.'],['Stone history','Open a stone (View, or find it with Search) and press History. It lists every event for that stone in date order: purchase or memo in, cutting, memo out, quotations, sale, customer return, return to supplier, and the matching lines from the Activity Log. It is the quickest way to answer where a stone has been and who had it.'],['Buyer requests, credit limits and gem details','Requests: note what a customer wants (gem, carat range, colour, budget). Matching stones in stock are counted and flagged in Alerts; open Matches to copy them as text for WhatsApp or start a quotation. Mark a request Done when finished. Parties → Edit: set a customer’s credit limit and payment terms in days. A new invoice that takes the customer above the limit asks you to confirm, Alerts flags customers over the limit, and the unpaid-invoice alert uses their payment terms instead of 30 days. Gem Stock → Edit now also holds laboratory, report date, clarity and dimensions, shown in the stone view, quotations and shared text.'],['Parcels (lots by weight)','Buy a lot with Gem Stock → Add stone / Buy stone and choose the shape Parcel: enter the whole weight and the total cost and price. When you sell part of it, press Split on the parcel: enter the carats taken out and the price per carat. The piece becomes a normal stone with its own code, taking its share of the cost at the parcel’s average cost per carat, and the parcel keeps the remaining weight and cost. Sell the pieces on invoices as usual. If the last of the parcel is split off, the parcel is marked Closed. Reports → Parcels shows bought, left, sold weight and profit for each parcel. A parcel that has been partly split cannot be returned to the supplier as a whole.'],['Export documents','Sales → View an invoice → Export documents (USD). Enter the delivery terms, payment terms, number of packages and any permit reference. You get a commercial invoice in US dollars (each stone with its description, certificate, weight, price per carat and amount, at the rate set in Backup → Settings) and a packing list with carats and grams, printed on two pages. Set the customer’s address and country in Parties, and your company name, address and export licence number in Backup → Settings → Company details. Check the wording and requirements with your shipping agent or the authority before using them for a real shipment.'],['Buying & Pricing','Buying & Pricing looks at what you have sold. For each gem type it shows how much of it has sold, how many days it took, the margin and the money tied up in stock, and marks it Buy more, Normal or Slow. The price-per-carat table and the price suggestion tool use your own past sales of the same gem type and carat size.'],['Customer Scorecard','Customer Scorecard rates each customer A, B or C by how much of their balance is overdue under their payment terms. It also shows total sales, profit, average days to pay, credit used against their limit and the date of the last deal.'],['Notifications','The bell at the top right shows your alerts. A red count means something is urgent. Click an alert to open the page it is about.'],['Suppliers','Suppliers compares each supplier: carats and cost bought, cost per carat, how much they sold for, profit and margin, average days to sell, and what you still owe. Price history shows the cost per carat of every purchase of a gem type (rough and cut stones can be viewed separately), so you can see whether a price is high or low against your average.'],['Weekly summary','Reports → Period Summary → This week or Last week (Monday to Sunday). Use Copy as text to paste the week into WhatsApp each Monday.'],['Payables Calendar','Money → Payables Calendar groups what you owe suppliers and cutters by week, from planned payments (Promise on Collections) and pending issued cheques. Balances with no date are listed at the bottom; use Plan to date them and Pay to settle. Copy as text shares the plan.'],['Stock Ageing','Stock → Stock Ageing shows how long unsold stones have been in stock, in age bands, with the cost tied up in each. Use the oldest list to reprice or offer slow stones.'],['Month-End report pack','Reports → Month-End now continues below the closing figures with stock by gem type, stock ageing, top customers this month and what you owe each supplier. Press Print report to print the whole pack.'],['Offer message','Stock → Stock Ageing → Make offer message. Choose how many days a stone must be in stock and the discount. You get a WhatsApp-ready list of up to 15 priced, cut stones with the old and new price. Nothing is changed in your stock; use Reprice if the offer is accepted.'],['Who to offer to','Stock → Stock Ageing → Who to offer slow stones to lists the three biggest past buyers of the same gem type for each stone older than 90 days, with phone numbers. Copy offer makes a short message for one stone.'],['Search and add on the spot','In any pop-up form, the lists of customers, suppliers, cutters, partners and gem types are search boxes: click, type part of a name (or a phone number) and pick from the list. If the person is not there yet, choose “+ Add new customer” (or supplier, cutter or partner), type the name and, if you like, the phone and country, and press Save. They are created in Parties and selected for you, so you can carry on with the invoice, purchase, quotation or cutting job. The stone lists in invoices, quotations and memos have a search box too: type a code, gem, colour, origin or certificate. Stones you have already ticked stay visible while you search.'],['Quick add and shortcuts','The round + button at the bottom right opens New sale, Buy stone, Add expense, Add party and Search from any page. On a computer you can also press N, B, E or P (when you are not typing in a box) and Ctrl+K for search.'],['Financial Reports','Reports → Financial Reports has a report picker and a period (this month, last month, this quarter, this year, all time or your own dates). Reports: Trial Balance, Profit and Loss (with the previous period beside it), Balance Sheet and Net Worth, Cash Flow by account, Net worth trend (month ends, rebuilt from the books for each date), Receivables and Payables ageing, Stock, Sales, Purchases and Expenses, each grouped the way you choose (gem type, shape, colour, origin, treatment, supplier, price band, customer, month and more). Print opens a letterhead page, Copy text is for WhatsApp, and CSV is for Excel. Trial Balance and Balance Sheet can be shown as of any past date; the Trial Balance proves the past figures against today’s owner capital. The owner capital line in the Trial Balance is a balancing figure, because the system does not hold a capital account.'],['Accounts Proof','Reports → Accounts Proof re-adds your books in independent ways and compares the results. It proves that the Cash Book matches its opening balances, transfers net to zero, what customers have paid matches the receipts in the Cash Book (plus cleared cheques), what you have paid suppliers and cutters matches the payments, every expense has its payment, stock and invoices agree, stock cost matches purchase cost, invoice arithmetic is right, document numbers are unique, and no Cash Book line points at a missing document. Green means it agrees to the rupee. Review or Error rows list the exact records to fix. It changes nothing.'],['Data Check','System → Data Check scans your records for mistakes: sold stones with no invoice, invoices with missing stones, payments above the total, stones with no cost or price, duplicate codes or certificate numbers, negative account balances and customers with a balance but no phone. Nothing is changed; use View or Open to fix each item yourself.'],['People graphics','Every supplier, customer and cutter gets a small drawn portrait in Suppliers & Customers and in the scorecards. The portrait is made from the name, so a person always keeps the same face. In Suppliers & Customers, press Photo on a row to use a real photo instead (it is cropped square and kept small, and is included in backups); press Change photo to remove it or choose another. The Dashboard opens with a greeting and a drawn portrait with today’s sales, stones in stock and cheques due. These are illustrations, not photos.'],['Looks and gallery','Use the three coloured dots at the bottom of the menu to switch between the Pearl, Sand (beige) and Jade looks. Your choice is remembered. In Gem Stock, Gallery view shows each stone as a photo card; press Table view to go back.'],['Collections','Collections lists everything customers owe you and everything you owe suppliers and cutters, oldest first. Use Promise to record the date and amount a customer promised (or the date you plan to pay), Remind to copy a polite WhatsApp reminder, and the cash forecast to see your expected balance over the next 30 days. Promises that pass their date show in Alerts.'],['Period summary','Period Summary works for any date range, such as a week or a quarter. It shows sales, gross profit, expenses, money in and out, profit by customer and profit by gem type. Copy it as text to share.'],['Daily summary','Daily Summary shows one day: sales, profit, money in and out, each account’s closing balance, stones bought and cheques or memos coming up. Print it or copy it as text for WhatsApp.'],['Trends','Trends shows charts for the last 6, 12 or 24 months: sales, gross profit and expenses; net profit after expenses and partners’ share; money in and out (transfers between your own accounts are left out); the balance of each cash and bank account at every month end; profit by gem type; and expenses by category. Point at a bar or dot to see the exact amount.'],['Memo (stones on approval)','Memo → New memo when you give stones out on approval. Settle it later by marking each stone Returned or Sold. Sold stones become an invoice automatically.'],['Cutting jobs','Add rough as a stone with shape Rough, and the cutter as a party of type Cutter. Then Cutting Jobs → Issue rough, and Receive when the cut stone comes back. Its cost becomes the rough cost plus the cutting fee, and the yield % is tracked.'],['Cheques','Add received and issued cheques with the bank account and due date. Clear a cheque to post it to that bank account and settle the party\u2019s oldest dues. Return it if it bounces.'],['Cash Book','Every payment, receipt, expense and cleared cheque posts here with its account. Use Transfer to move money between accounts and Check balance to compare with what you counted or what the bank shows.'],['Photos, labels and scanning','Open View on any stone to add a gem photo and certificate image. Print barcode labels from Gem Stock. Scan a label into the stock search box and press Enter to open that stone.'],['Stock take','Stock Take → Start new count, then scan every stone you physically have (or type its code and press Enter). The page shows what is missing and anything scanned that the system does not expect. Finish to save the result in Past counts.'],['Month-end closing','Month-End → pick the month. It shows sales, cost, expenses, net profit and every account\u2019s opening, in, out and closing balance, plus a checklist of pending cheques and open memos. Print it, then press Close & lock. After locking, no entry on or before that day can be added, edited, cancelled or cleared. To unlock, change the date in Backup → Settings.'],['Alerts and reports','Alerts lists everything needing attention. Reports shows P&L, receivables aging, stock valuation, top customers and cutter performance.'],['Using it on a phone','On a phone a bar at the bottom gives you Home, Stock, Sales, Search and Menu. Menu opens the full list of pages. Tables slide sideways, forms and pop-ups slide up from the bottom, and fields are sized so the phone does not zoom when you tap them. Add the page to your home screen from the browser menu to open it like an app. Your data is stored in that phone’s browser, so a phone and a computer each hold their own separate copy until Firebase is added; use Backup to move data between them.'],['Backups and storage','Backup shows the date of your last backup and how full the browser storage is. Alerts warn you when no backup was downloaded for over 7 days, or storage passes 70%. Restoring a backup asks for confirmation because it replaces everything. Closing a month offers to download a backup straight away.'],['Your data','Everything is saved in this browser only. Download a backup from the Backup page often, especially after adding photos and before clearing browser data.']];return`<h1>User Guide</h1><div class="card">${g.map((x,i)=>`<details ${i?'':'open'} style="padding:8px 0;border-bottom:1px solid var(--bd)"><summary style="cursor:pointer;font-weight:600">${x[0]}</summary><p class="m" style="margin-top:6px">${x[1]}</p></details>`).join('')}</div>`},
log(){return`<h1>Activity Log</h1><div class="card">${tbl(['When','What'],(D.log||[]).slice().reverse().map(x=>`<tr><td>${x.t}</td><td>${e(x.m)}</td></tr>`))}</div><p class="m">Records cancelled invoices, stone changes and cheque actions. The Cash Book is the record of every money movement.</p>`},
stocktake(){const t=D.take,sc=t?t.codes:[],exp=D.stones.filter(s=>INS(s)),miss=exp.filter(s=>!sc.includes(s.code)),unx=sc.map(c=>D.stones.find(s=>s.code==c)).filter(s=>s&&!INS(s));return`<h1>Stock Take</h1>${t?'':'<p class="m" style="margin-bottom:10px">Start a count, then scan every stone you physically have.</p>'}<div class="bar">${t?`<input id="sc" placeholder="Scan or type a stone code, then press Enter" onkeydown="if(event.key=='Enter'){takeScan(this.value)}"><button class="b1" onclick="takeFinish()">Finish &amp; save</button><button onclick="if(confirm('Discard this count?')){D.take=null;TM=null;save();go()}">Discard</button>`:`<button class="b1" onclick="D.take={start:today(),codes:[]};save();go()">Start new count</button>`}</div>${t&&TM?`<div class="card" style="border-color:${TM[0]=='ok'?'var(--g)':'var(--r)'}"><b class="${TM[0]=='ok'?'ok':'bad'}">${e(TM[1])}</b></div>`:''}${t?`<div class="kp"><div class="k"><small>Expected in stock</small><b>${exp.length}</b></div><div class="k"><small>Found</small><b class="ok">${exp.length-miss.length}</b></div><div class="k"><small>Not found yet</small><b class="${miss.length?'bad':''}">${miss.length}</b></div><div class="k"><small>Missing cost value</small><b>${rs(miss.reduce((a,s)=>a+s.cost,0))}</b></div></div><div class="two"><div class="card"><h3>Not found yet</h3>${tbl(['Code','Stone','#Carats','#Cost'],miss.map(s=>`<tr><td>${s.code}</td><td>${e(s.type)}</td><td class="r">${ct(s.carats)}</td><td class="r">${rs(s.cost)}</td></tr>`))}</div><div class="card"><h3>Scanned but not expected</h3>${tbl(['Code','Stone','Status'],unx.map(s=>`<tr><td>${s.code}</td><td>${e(s.type)}</td><td>${st(s.status)}</td></tr>`))}</div></div>`:''}<div class="card"><h3>Past counts</h3>${tbl(['Date','#Expected','#Found','#Missing','Missing codes'],(D.takes||[]).slice().reverse().map(x=>`<tr><td>${x.d}</td><td class="r">${x.e}</td><td class="r">${x.f}</td><td class="r ${x.m.length?'bad':''}">${x.m.length}</td><td>${e(x.m.join(', '))}</td></tr>`))}</div>`},
memo(){const t=today();return`<h1>Memo / Consignment</h1><div class="bar"><button class="b1" onclick="memoForm()">+ New memo</button></div><div class="card">${tbl(['Memo','Date','Customer','Stones','#Value','Return by','Status',''],D.memo.slice().reverse().map(m=>{const v=m.items.reduce((a,i)=>a+S(i).price,0),od=!m.closed&&m.due<t;return`<tr><td>${m.no}</td><td>${m.date}</td><td>${e(P(m.party))}</td><td>${m.items.map(i=>S(i).code).join(', ')}</td><td class="r">${rs(v)}</td><td class="${od?'bad':''}">${m.due}</td><td><span class="tag ${m.closed?'s':'o'}">${m.closed?'Settled':od?'Overdue':'Out'}</span></td><td>${m.closed?'':`<button class="sm" onclick="memoSettle('${m.id}')">Settle</button>`}</td></tr>`}))}</div><p class="m">Settling lets you mark each stone Returned or Sold. Sold stones become an invoice automatically.</p><h2 style=\"margin:18px 0 8px;font-size:16px\">Memo In – stones received on approval from suppliers</h2><div class=\"bar\"><button class=\"b1\" onclick=\"minForm()\">+ Receive stone on memo</button></div><div class=\"card\">${tbl(['Memo','Received','Supplier','Stone','#Agreed cost','Return / pay by','Status',''],D.minn.slice().reverse().map(m=>{const s=S(m.stone),od=m.status=='Open'&&m.due<t;return`<tr><td>${m.no}</td><td>${m.date}</td><td>${e(P(m.party))}</td><td>${s.code} ${e(s.type||'')} ${ct(s.carats)}ct</td><td class=\"r\">${rs(m.cost)}</td><td class=\"${od?'bad':''}\">${m.due}</td><td><span class=\"tag ${m.status=='Open'?'o':'s'}\">${od?'Overdue':m.status}</span></td><td>${m.status=='Open'?`<button class=\"sm\" onclick=\"minBuy('${m.id}')\">Buy</button> <button class=\"sm\" onclick=\"minRet('${m.id}')\">Return</button>`:''}</td></tr>`}))}</div><p class=\"m\">Memo In stones are not yours yet: they are not in stock value, cannot be sold, and owe nothing. Press Buy to turn one into a normal purchase (the supplier is owed the agreed cost), or Return to send it back.</p>`},
cheques(){const t=today(),pr=D.chq.filter(c=>c.status=='Pending'),sm=y=>rs(pr.filter(c=>c.type==y).reduce((a,c)=>a+c.amt,0)),od=pr.filter(c=>c.date<t).length;return`<h1>Cheque Desk</h1><div class="kp"><div class="k"><small>Pending received</small><b>${sm('Received')}</b></div><div class="k"><small>Pending issued</small><b>${sm('Issued')}</b></div><div class="k"><small>Overdue cheques</small><b class="${od?'bad':''}">${od}</b></div></div><div class="bar"><button class="b1" onclick="chqForm()">+ Add cheque</button></div><div class="card">${tbl(['Due date','Type','Cheque no','Bank','Party','#Amount','Status',''],D.chq.slice().sort((a,b)=>a.date<b.date?-1:1).map(c=>`<tr><td class="${c.status=='Pending'&&c.date<t?'bad':''}">${c.date}</td><td>${c.type}</td><td>${e(c.no)}</td><td>${e(c.bank)}</td><td>${e(P(c.party))}</td><td class="r">${rs(c.amt)}</td><td><span class="tag ${c.status=='Cleared'?'s':c.status=='Pending'?'o':''}">${c.status}</span></td><td>${c.status=='Pending'?`<button class="sm" onclick="chq('${c.id}','Cleared')">Clear</button> <button class="sm" onclick="chq('${c.id}','Returned')">Return</button>`:''}</td></tr>`))}</div><p class="m">Clearing a cheque settles that party’s oldest unpaid invoices, purchases or cutting fees first.</p>`},
reports(){const m=today().slice(0,7),all=RP=='all',inP=d=>all||d.startsWith(m),ss=D.sales.filter(s=>inP(s.date)),rev=ss.reduce((a,s)=>a+saleTotal(s),0),cg=ss.reduce((a,s)=>a+saleCost(s),0),xs=D.exp.filter(x=>inP(x.date)),ex=xs.reduce((a,x)=>a+x.amt,0),cat={},ag=[0,0,0],vt={},cu={},cj={};
xs.forEach(x=>cat[x.cat]=(cat[x.cat]||0)+x.amt);D.sales.forEach(s=>{const d=saleTotal(s)-s.paid;if(d>0){const a=(Date.now()-new Date(s.date))/864e5;ag[a<=30?0:a<=60?1:2]+=d}});
D.stones.filter(s=>['In stock','Memo'].includes(s.status)).forEach(s=>{const v=vt[s.type]=vt[s.type]||{n:0,c:0,k:0,p:0};v.n++;v.c+=s.carats;v.k+=s.cost;v.p+=s.price});
ss.forEach(s=>{const v=cu[s.party]=cu[s.party]||{n:0,r:0,p:0};v.n++;v.r+=saleTotal(s);v.p+=saleTotal(s)-saleCost(s)});D.jobs.forEach(j=>{const v=cj[j.party]=cj[j.party]||{n:0,d:0,y:0,f:0};v.n++;v.f+=j.cost;if(j.done){v.d++;v.y+=j.out/j.inCt}});
const L=(a,b)=>`<tr><td>${a}</td><td class="r">${b}</td></tr>`,psh=partnerPS(ss),net=rev-cg-ex-psh;
return`<h1>Reports</h1><div class="bar"><select onchange="RP=this.value;go()"><option value="month" ${all?'':'selected'}>This month</option><option value="all" ${all?'selected':''}>All time</option></select></div><div class="two"><div class="card"><h3>Profit &amp; Loss</h3><table>${L('Sales revenue',rs(rev))}${L('Cost of stones sold',rs(cg))}${L('<b>Gross profit</b>','<b>'+rs(rev-cg)+'</b>')}${Object.entries(cat).map(([k,v])=>L('Expense: '+k,rs(v))).join('')}${psh?L('Less: partners’ profit share','-'+rs(psh)):''}${L('<b>Net profit</b>',`<b class="${net<0?'bad':'ok'}">${rs(net)}</b>`)}</table></div><div class="card"><h3>Receivables aging</h3><table>${L('0 – 30 days',rs(ag[0]))}${L('31 – 60 days',rs(ag[1]))}${L('Over 60 days',`<span class="${ag[2]?'bad':''}">${rs(ag[2])}</span>`)}${L('<b>Total</b>','<b>'+rs(ag[0]+ag[1]+ag[2])+'</b>')}</table></div></div><div class="card"><h3>Stock valuation by gem type</h3>${tbl(['Type','#Stones','#Carats','#Cost','#Selling value','#Margin'],Object.entries(vt).map(([k,v])=>`<tr><td>${e(k)}</td><td class="r">${v.n}</td><td class="r">${ct(v.c)}</td><td class="r">${rs(v.k)}</td><td class="r">${rs(v.p)}</td><td class="r ok">${rs(v.p-v.k)}</td></tr>`))}</div><div class="two"><div class="card"><h3>Top customers</h3>${tbl(['Customer','#Invoices','#Sales','#Profit'],Object.entries(cu).sort((a,b)=>b[1].r-a[1].r).map(([k,v])=>`<tr><td>${e(P(k))}</td><td class="r">${v.n}</td><td class="r">${rs(v.r)}</td><td class="r ok">${rs(v.p)}</td></tr>`))}</div><div class="card"><h3>Cutter performance</h3>${tbl(['Cutter','#Jobs','#Done','#Avg yield','#Fees'],Object.entries(cj).map(([k,v])=>`<tr><td>${e(P(k))}</td><td class="r">${v.n}</td><td class="r">${v.d}</td><td class="r">${v.d?(v.y/v.d*100).toFixed(1)+'%':'-'}</td><td class="r">${rs(v.f)}</td></tr>`))}</div></div>${profitCards(ss)}${ageCard()}${parcelCard()}`},
jobs(){return`<h1>Cutting &amp; Polishing Jobs</h1><div class="bar"><button class="b1" onclick="jobForm()">+ Issue rough to cutter</button></div><div class="card">${tbl(['Job','Date','Cutter','Rough','#In ct','#Out ct','#Yield','#Fee','#Due','Status',''],D.jobs.slice().reverse().map(j=>{const d=j.cost-j.paid;return`<tr><td>${j.no}</td><td>${j.date}</td><td>${e(P(j.party))}</td><td>${S(j.rough).code}</td><td class="r">${ct(j.inCt)}</td><td class="r">${j.done?ct(j.out):'-'}</td><td class="r">${j.done?(j.out/j.inCt*100).toFixed(1)+'%':'-'}</td><td class="r">${rs(j.cost)}</td><td class="r ${d>0?'bad':''}">${rs(d)}</td><td>${j.done?'<span class="tag s">Done</span>':'<span class="tag o">With cutter</span>'}</td><td>${j.done?'':`<button class="sm" onclick="jobDone('${j.id}')">Receive</button> `}${d>0?`<button class="sm" onclick="pay('jobs','${j.id}')">Pay</button>`:''}</td></tr>`}))}</div>`},
expenses(){return`<h1>Expenses</h1><div class="bar"><button class="b1" onclick="expForm()">+ Add expense</button></div><div class="card">${tbl(['Date','Category','Description','#Amount',''],D.exp.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.cat}</td><td>${e(x.desc)}</td><td class="r">${rs(x.amt)}</td><td><button class="sm" onclick="if(locked('${x.date}'))return lockMsg();if(confirm('Delete this expense?')){D.sales.forEach(z=>{if(z.id=='${x.sale||''}')z.comm=Math.max(0,(z.comm||0)-${x.amt})});D.exp=D.exp.filter(y=>y.id!='${x.id}');D.cash=D.cash.filter(y=>y.ref!='${x.id}');save();go()}">Delete</button></td></tr>`))}</div>`},
